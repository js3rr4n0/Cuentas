<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentas Claras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
:root {
  /* Layout: libreta de cuentas de bolsillo. Teléfono: una columna, pestañas abajo y el botón de agregar al centro. Escritorio: pestañas arriba y dos columnas. Papel verde de columnas, tinta negra para las acciones; aqua entra, naranja sale, azul se guarda. */
  --paper: #e9f0e6;
  --sheet: #f8fbf6;
  --sheet-2: #eef3eb;
  --rule: #d5dfd3;
  --rule-2: #adbfb0;
  --ink: #142019;
  --ink-2: #485a50;
  --ink-3: #5c6d63;
  --pen: #142019;
  --pen-ink: #f8fbf6;
  --wash: rgba(20, 32, 25, .06);
  --c-in: #1baf7a;
  --c-out: #eb6834;
  --c-save: #2a78d6;
  --c-prev: #9fb0a5;
  --in-text: #0b7a55;
  --guil: #5d927a;
  --ok: #0a6b2a;
  --ok-bg: #e0f0e2;
  --warn: #8a5a00;
  --warn-bg: #f8ecd0;
  --bad: #b3261e;
  --bad-bg: #f9e1dd;
  --backdrop: rgba(12, 20, 16, .45);
  --shadow: 0 1px 0 rgba(20, 32, 25, .05), 0 12px 30px -18px rgba(20, 32, 25, .35);
  --f-sans: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 14px;
  --dock-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c1310;
    --sheet: #141d19;
    --sheet-2: #1a2520;
    --rule: #25322c;
    --rule-2: #3a4b43;
    --ink: #e4ebe6;
    --ink-2: #b0beb6;
    --ink-3: #8f9f96;
    --pen: #e4ebe6;
    --pen-ink: #0c1310;
    --wash: rgba(228, 235, 230, .07);
    --c-in: #199e70;
    --c-out: #d95926;
    --c-save: #3987e5;
    --c-prev: #5b6b62;
    --in-text: #45c896;
    --guil: #4f7d68;
    --ok: #4cc76a;
    --ok-bg: #16301f;
    --warn: #f2b53a;
    --warn-bg: #33280f;
    --bad: #ff8a80;
    --bad-bg: #3a1c1a;
    --backdrop: rgba(0, 0, 0, .62);
    --shadow: 0 1px 0 rgba(0, 0, 0, .35), 0 14px 34px -18px rgba(0, 0, 0, .75);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c1310;
  --sheet: #141d19;
  --sheet-2: #1a2520;
  --rule: #25322c;
  --rule-2: #3a4b43;
  --ink: #e4ebe6;
  --ink-2: #b0beb6;
  --ink-3: #8f9f96;
  --pen: #e4ebe6;
  --pen-ink: #0c1310;
  --wash: rgba(228, 235, 230, .07);
  --c-in: #199e70;
  --c-out: #d95926;
  --c-save: #3987e5;
  --c-prev: #5b6b62;
  --in-text: #45c896;
  --guil: #4f7d68;
  --ok: #4cc76a;
  --ok-bg: #16301f;
  --warn: #f2b53a;
  --warn-bg: #33280f;
  --bad: #ff8a80;
  --bad-bg: #3a1c1a;
  --backdrop: rgba(0, 0, 0, .62);
  --shadow: 0 1px 0 rgba(0, 0, 0, .35), 0 14px 34px -18px rgba(0, 0, 0, .75);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--paper); }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.neg { color: var(--bad); }
.pos { color: var(--in-text); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- Estructura ---------- */
.app {
  max-width: 1160px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 0 calc(var(--dock-h) + 44px + env(safe-area-inset-bottom, 0px));
}
.masthead {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-inline: -16px;
  padding: 12px 16px 10px;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-mark { width: 28px; height: 28px; flex: none; color: var(--ink); }
.brand-name { font-weight: 800; font-stretch: 122%; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.month-switch {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: 999px;
}
.month-label {
  border: 0;
  background: none;
  padding: 6px 6px;
  border-radius: 999px;
  font-weight: 650;
  font-size: 14px;
  white-space: nowrap;
  min-width: 6.4em;
  text-align: center;
}
.month-label .m-short { display: none; }
.icon-btn {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 999px;
  background: none;
  color: var(--ink-2);
}
.icon-btn:hover { background: var(--wash); color: var(--ink); }
.icon-btn:disabled { opacity: .3; cursor: default; background: none; }
.icon-btn svg, .btn svg { width: 18px; height: 18px; }
.btn.add-desktop { display: none; }
@media (max-width: 419px) {
  .month-label .m-full { display: none; }
  .month-label .m-short { display: inline; }
  .month-label { min-width: 5em; }
}
@media (max-width: 349px) { .brand-name { display: none; } }

/* Barra de pestañas: abajo en teléfono */
.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  background: var(--sheet);
  border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr 80px 1fr 1fr;
  max-width: 560px;
  height: var(--dock-h);
  margin: 0 auto;
}
.tab {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: 0;
  background: none;
  color: var(--ink-3);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .01em;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 750; }
.tab[aria-selected="true"]::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 28%;
  right: 28%;
  height: 2px;
  background: var(--ink);
  border-radius: 0 0 2px 2px;
}
.tab:nth-child(3) { grid-column: 4; }
.tab:nth-child(4) { grid-column: 5; }
.fab {
  position: absolute;
  left: 50%;
  top: -20px;
  transform: translateX(-50%);
  width: 60px;
  height: 60px;
  border: 0;
  border-radius: 50%;
  background: var(--pen);
  color: var(--pen-ink);
  display: grid;
  place-items: center;
  box-shadow: 0 0 0 5px var(--paper), 0 10px 24px -8px rgba(0, 0, 0, .5);
}
.fab svg { width: 26px; height: 26px; }
.fab:active { transform: translateX(-50%) scale(.96); }

/* ---------- Vistas y tarjetas ---------- */
.view { display: grid; gap: 14px; padding-top: 14px; }
.view[hidden] { display: none; }
.col { display: contents; }
.view > *, .col > * { order: var(--o, 50); min-width: 0; }
.card {
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 16px;
  min-width: 0;
  scroll-margin-top: 84px;
}
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-t { margin: 0; font-size: 16px; font-weight: 750; font-stretch: 112%; letter-spacing: -.005em; line-height: 1.25; }
.card-sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.fine { font-size: 12.5px; color: var(--ink-3); margin-top: 10px; }
.empty { font-size: 14px; color: var(--ink-2); padding: 6px 0 2px; max-width: 46ch; }
.card-foot { margin-top: 12px; display: flex; justify-content: flex-end; }
.link {
  border: 0;
  background: none;
  padding: 4px 0;
  font-size: 14px;
  font-weight: 650;
  color: var(--ink);
  text-decoration: underline;
  text-decoration-color: var(--rule-2);
  text-underline-offset: 4px;
}
.link:hover { text-decoration-color: var(--ink); }

/* Aviso superior */
.notice {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 14px;
  margin-top: 12px;
  padding: 12px 14px;
  background: var(--sheet);
  border: 1px dashed var(--rule-2);
  border-radius: 12px;
  font-size: 14px;
  color: var(--ink-2);
}
.notice p { flex: 1 1 240px; }
.notice b { color: var(--ink); }
.notice.warn { border-style: solid; border-color: var(--warn); background: var(--warn-bg); color: var(--ink); }

/* ---------- Cheque (héroe) ---------- */
.cheque {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background: var(--sheet);
  border: 1px solid var(--rule-2);
  border-radius: 16px;
  padding: 16px 18px 16px;
  box-shadow: var(--shadow);
}
.cheque .guil { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
.cheque-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.folio { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-3); white-space: nowrap; }
.hero-fig {
  margin: 8px 0 2px;
  font-size: clamp(40px, 12vw, 62px);
  font-weight: 750;
  font-stretch: 106%;
  letter-spacing: -.025em;
  line-height: 1.04;
  overflow-wrap: anywhere;
}
.hero-words {
  font-size: 13.5px;
  color: var(--ink-2);
  padding: 4px 0 5px;
  border-bottom: 1px solid var(--rule-2);
  max-width: 34em;
}
.hero-words .eyebrow { margin-right: 6px; }
.double-rule { height: 4px; margin: 14px 0 12px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); opacity: .75; }
.hero-split { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; }
.hero-split dt { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.hero-split dd { margin: 3px 0 0; font-family: var(--f-mono); font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
.hero-note { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--rule-2); font-size: 14px; color: var(--ink-2); }
.hero-note b { color: var(--ink); }
.hero-cta { margin-top: 12px; }
.stamp {
  position: absolute;
  right: 20px;
  top: 56px;
  transform: rotate(-11deg);
  padding: 2px 8px 2px 11px;
  border: 2px solid currentColor;
  border-radius: 4px;
  color: var(--bad);
  opacity: .55;
  font-family: var(--f-mono);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .26em;
  text-transform: uppercase;
  pointer-events: none;
}

/* Claves de color */
.key { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--ink-3); }
.key-in { background: var(--c-in); }
.key-out { background: var(--c-out); }
.key-save { background: var(--c-save); }
.key-proj { background: transparent; border: 1.5px dashed var(--c-out); }
.key-tick { width: 3px; height: 13px; border-radius: 1px; background: var(--ink); }
.kl { display: inline-block; flex: none; width: 14px; height: 0; border-top: 2px solid var(--ink-3); border-radius: 2px; }
.kl-in { border-top-color: var(--c-in); }
.kl-out { border-top-color: var(--c-out); }
.kl-save { border-top-color: var(--c-save); }
.kl-prev { border-top-color: var(--c-prev); }
.kl-proj { border-top: 2px dashed var(--c-out); }
.dot { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; }
.dot-g { background: var(--c-out); }
.dot-i { background: var(--c-in); }
.dot-a { background: var(--c-save); }

/* Píldoras de estado */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 650;
  line-height: 1.5;
  white-space: nowrap;
  vertical-align: 1px;
}
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.pill.neutral { color: var(--ink-2); background: var(--sheet-2); box-shadow: inset 0 0 0 1px var(--rule); }

/* Predicción */
.pred-big { font-size: 22px; font-weight: 700; font-stretch: 104%; line-height: 1.25; letter-spacing: -.01em; }
.pred-big b { font-weight: 800; }
.meter-wrap { position: relative; margin: 14px 0 8px; }
.meter { position: relative; height: 12px; overflow: hidden; border-radius: 0 6px 6px 0; background: var(--sheet-2); box-shadow: inset 0 0 0 1px var(--rule); }
.m-spent { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c-out); border-radius: 0 4px 4px 0; }
.m-proj {
  position: absolute;
  top: 0;
  bottom: 0;
  background: color-mix(in srgb, var(--c-out) 14%, transparent);
  border: 1.5px dashed var(--c-out);
  border-left: 0;
  border-radius: 0 4px 4px 0;
}
.m-inc { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1.5px; border-radius: 1px; background: var(--ink); }
.facts { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; font-size: 14px; color: var(--ink-2); }
.facts li { display: flex; gap: 8px; align-items: baseline; }
.facts li::before { content: ""; flex: none; width: 5px; height: 5px; margin-top: 7px; border-radius: 50%; background: var(--rule-2); align-self: flex-start; }
.facts b { color: var(--ink); }
.stat-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 14px; }
.stat { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat .lab { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.stat .val { font-family: var(--f-mono); font-size: 15px; font-weight: 600; overflow-wrap: anywhere; text-align: right; }
@media (min-width: 520px) {
  .stat-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat { display: block; }
  .stat .val { margin-top: 2px; text-align: left; font-size: 16px; }
}
.alerts { display: grid; gap: 8px; margin-top: 12px; }
.alert { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-2); padding: 10px 12px; border-radius: 10px; background: var(--sheet-2); }
.alert b { color: var(--ink); }

/* Leyenda y gráficas */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 6px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-wrap { position: relative; min-height: 120px; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart-empty { display: grid; place-items: center; min-height: 160px; text-align: center; font-size: 14px; color: var(--ink-3); border: 1px dashed var(--rule-2); border-radius: 10px; padding: 16px; }
.ax { font-family: var(--f-mono); font-size: 10.5px; fill: var(--ink-3); }
.ax-strong { fill: var(--ink); font-weight: 600; }
.gl { stroke: var(--rule); stroke-width: 1; }
.gl-base { stroke: var(--rule-2); stroke-width: 1; }
.bar-in { fill: var(--c-in); }
.bar-out { fill: var(--c-out); }
.bar-save { fill: var(--c-save); }
.proj-out { fill: color-mix(in srgb, var(--c-out) 12%, transparent); stroke: var(--c-out); stroke-width: 1.25; stroke-dasharray: 3 2.5; }
.sel-band { fill: var(--wash); }
.hit { fill: transparent; cursor: pointer; outline: none; }
.hit:focus-visible { stroke: var(--ink); stroke-width: 1.5; }
.ln-out { fill: none; stroke: var(--c-out); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ln-proj { fill: none; stroke: var(--c-out); stroke-width: 2; stroke-dasharray: 5 5; stroke-linecap: round; }
.ln-prev { fill: none; stroke: var(--c-prev); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ln-inc { stroke: var(--c-in); stroke-width: 1.5; }
.area-out { fill: var(--c-out); opacity: .1; }
.dot-end { fill: var(--c-out); stroke: var(--sheet); stroke-width: 2; }
.dot-hover { stroke: var(--sheet); stroke-width: 2; }
.xhair { stroke: var(--ink-3); stroke-width: 1; }
.clbl { font-family: var(--f-mono); font-size: 11px; fill: var(--ink-2); }
.clbl-strong { font-family: var(--f-mono); font-size: 11px; font-weight: 600; fill: var(--ink); }
.overlay { fill: transparent; cursor: crosshair; outline: none; }
.overlay:focus-visible { stroke: var(--ink); stroke-width: 1; }
.tip {
  position: absolute;
  z-index: 5;
  left: 0;
  top: 0;
  min-width: 156px;
  max-width: 240px;
  padding: 8px 10px;
  background: var(--sheet);
  border: 1px solid var(--rule-2);
  border-radius: 10px;
  box-shadow: var(--shadow);
  font-size: 12.5px;
  pointer-events: none;
}
.tip-h { font-weight: 700; margin-bottom: 4px; color: var(--ink); }
.tip-r { display: grid; grid-template-columns: 14px auto 1fr; align-items: center; gap: 7px; padding: 1px 0; }
.tip-r b { font-family: var(--f-mono); font-weight: 600; color: var(--ink); white-space: nowrap; }
.tip-r span { color: var(--ink-3); }
.tip-foot { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--rule); color: var(--ink-2); }
.tip-foot b { font-family: var(--f-mono); color: var(--ink); }

/* Interruptor gráfica/tabla */
.mini-seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--sheet-2); border: 1px solid var(--rule); }
.mini-seg button { border: 0; background: none; padding: 4px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.mini-seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 0 0 1px var(--rule-2); }

/* Barras de categoría */
.cbars { display: grid; }
.cbar { display: grid; gap: 5px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.cbar:last-child { border-bottom: 0; }
.cbar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.cbar-name { min-width: 0; font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
.cbar-val { font-family: var(--f-mono); font-size: 14px; font-weight: 600; white-space: nowrap; }
.cbar-track { position: relative; height: 8px; border-radius: 0 4px 4px 0; background: var(--sheet-2); }
.cbar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--c-out); }
.cbar-fill.in { background: var(--c-in); }
.cbar-fill.save { background: var(--c-save); }
.cbar-fill.neutral { background: var(--ink-3); }
.cbar-lim { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink); }
.cbar-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12.5px; color: var(--ink-3); }

/* Ahorro */
.slider-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin: 4px 0 6px; }
.slider-row label { font-size: 13px; font-weight: 650; color: var(--ink-2); }
.slider-row output { font-family: var(--f-mono); font-weight: 600; min-width: 3.2em; text-align: right; }
input[type="range"] { width: 100%; accent-color: var(--pen); }
.save-total { margin: 8px 0 4px; font-size: 15px; color: var(--ink-2); }
.save-total b { font-size: 20px; color: var(--ink); font-weight: 750; }
.sv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.sv:last-child { border-bottom: 0; }
.sv-name { font-weight: 600; font-size: 14.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.sv-amt { font-family: var(--f-mono); font-weight: 600; font-size: 14px; text-align: right; white-space: nowrap; }
.sv-amt small { font-family: var(--f-sans); font-size: 12px; font-weight: 500; color: var(--ink-3); }
.sv-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; font-size: 12.5px; color: var(--ink-3); }

/* 50/30/20 */
.rule-row { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.rule-row:last-child { border-bottom: 0; }
.rule-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rule-name { font-weight: 600; font-size: 14.5px; }
.rule-name small { display: block; font-weight: 400; font-size: 12.5px; color: var(--ink-3); }
.rule-pct { font-family: var(--f-mono); font-weight: 600; white-space: nowrap; }
.rule-track { position: relative; height: 10px; background: var(--sheet-2); border-radius: 0 5px 5px 0; }
.rule-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
.rule-target { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }

/* Tabla tipo libro mayor */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.ledger-t { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 13px; }
.ledger-t th, .ledger-t td { padding: 9px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
.ledger-t th:first-child, .ledger-t td:first-child { text-align: left; padding-left: 2px; }
.ledger-t thead th { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); border-bottom: 1px solid var(--rule-2); }
.ledger-t tbody td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.ledger-t tbody th { font-weight: 600; }
.ledger-t tfoot th, .ledger-t tfoot td { font-family: var(--f-mono); font-weight: 700; border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); }
.ledger-t tfoot th { font-family: var(--f-sans); }
.ledger-t tr.sel > * { background: var(--wash); }
.row-btn { border: 0; background: none; padding: 0; font-weight: 600; text-align: left; text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
.ledger-t .tag { font-family: var(--f-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-left: 6px; text-decoration: none; }

/* Movimientos */
.toolbar { display: grid; gap: 10px; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input { padding-left: 40px; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
.check input { width: 18px; height: 18px; accent-color: var(--pen); margin: 0; }
.list-sum { font-size: 13px; color: var(--ink-3); padding: 2px 2px 0; }
.list-sum b { font-family: var(--f-mono); color: var(--ink); font-weight: 600; }
.ledger { position: relative; }
.day-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 16px 2px 6px;
  border-bottom: 1px solid var(--rule-2);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-2);
}
.day-h:first-child { padding-top: 4px; }
.day-h .mono { font-weight: 500; color: var(--ink-3); }
.mov {
  display: grid;
  grid-template-columns: 9px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 0 2px 0 4px;
  border: 0;
  border-bottom: 1px solid var(--rule);
  background: none;
  text-align: left;
}
.mov:hover { background: var(--wash); }
.mov-main { display: grid; gap: 1px; padding: 10px 0; min-width: 0; }
.mov-cat { font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
.mov-sub { font-size: 12.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.mov-amt {
  align-self: stretch;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  min-width: 104px;
  padding-left: 12px;
  border-left: 1px solid var(--rule);
  font-family: var(--f-mono);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
}
.mov-amt.i { color: var(--in-text); }
.mov-amt.a { color: var(--ink-2); }

/* ---------- Formularios ---------- */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
.hint { font-size: 12.5px; color: var(--ink-3); }
.input, select.input {
  width: 100%;
  min-width: 0;
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid var(--rule-2);
  border-radius: 10px;
  background: var(--sheet);
  color: var(--ink);
  font-size: 16px;
}
.input:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
.input::placeholder { color: var(--ink-3); opacity: .8; }
.field-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 359px) { .field-row { grid-template-columns: minmax(0, 1fr); } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 34px;
  padding: 6px 12px;
  border: 1px solid var(--rule-2);
  border-radius: 999px;
  background: var(--sheet);
  font-size: 13.5px;
  font-weight: 550;
  line-height: 1.2;
  text-align: left;
}
.chip:hover { background: var(--wash); }
.chip.on, .chip[aria-pressed="true"] { background: var(--pen); color: var(--pen-ink); border-color: var(--pen); }
.chip.new { border-style: dashed; }
.chip.new.on { border-style: solid; }
.seg {
  display: grid;
  grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr));
  gap: 4px;
  padding: 4px;
  background: var(--sheet-2);
  border: 1px solid var(--rule);
  border-radius: 12px;
}
.seg label { position: relative; display: block; }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg span {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 6px;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 650;
  color: var(--ink-2);
  text-align: center;
}
.seg.sm span { padding: 7px 4px; font-size: 13px; }
.seg input:checked + span { background: var(--sheet); color: var(--ink); box-shadow: 0 0 0 1px var(--rule-2), 0 1px 3px rgba(0, 0, 0, .08); }
.seg input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 1px; }
.amount-field { display: flex; align-items: baseline; gap: 6px; padding: 4px 2px 4px; border-bottom: 2px solid var(--ink); }
.amount-field:focus-within { border-bottom-width: 3px; padding-bottom: 3px; }
.amount-field .cur { font-size: 28px; font-weight: 600; color: var(--ink-3); }
.amount-field input {
  width: 100%;
  min-width: 0;
  padding: 0;
  border: 0;
  outline: none;
  background: none;
  font-size: 40px;
  font-weight: 700;
  font-stretch: 104%;
  letter-spacing: -.015em;
}
.amount-field input::placeholder { color: var(--rule-2); }
.amount-calc { min-height: 18px; margin-top: 4px; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-3); }
.form-error { min-height: 0; font-size: 13.5px; font-weight: 600; color: var(--bad); }
.form-error:empty { display: none; }
.new-kind { display: grid; gap: 6px; padding: 10px; border-radius: 10px; background: var(--sheet-2); border: 1px dashed var(--rule-2); }
.new-kind[hidden] { display: none; }

/* Botones */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 16px;
  border: 1px solid var(--rule-2);
  border-radius: 10px;
  background: var(--sheet);
  color: var(--ink);
  font-size: 14.5px;
  font-weight: 650;
  white-space: nowrap;
}
.btn:hover { background: var(--wash); }
.btn-primary { background: var(--pen); color: var(--pen-ink); border-color: var(--pen); }
.btn-primary:hover { background: var(--pen); opacity: .9; }
.btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--rule-2)); }
.btn-danger-solid { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.btn-danger-solid:hover { background: var(--bad); opacity: .9; }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Categorías ---------- */
.cat-group + .cat-group { margin-top: 18px; }
.cat-group-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rule-2); }
.cat-group-h h3 { margin: 0; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.cat-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 18px;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 2px;
  border: 0;
  border-bottom: 1px solid var(--rule);
  background: none;
  text-align: left;
}
.cat-row:hover { background: var(--wash); }
.cat-row .nm { font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; }
.cat-row .meta { display: block; font-size: 12.5px; font-weight: 400; color: var(--ink-3); }
.cat-row svg { width: 16px; height: 16px; color: var(--ink-3); transition: transform .15s; }
.cat-row[aria-expanded="true"] svg { transform: rotate(90deg); }
.cat-edit { display: grid; gap: 12px; padding: 12px; margin: 6px 0 10px; border-radius: 12px; background: var(--sheet-2); border: 1px solid var(--rule); }
.add-form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-bottom: 14px; }
.add-form .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.data-actions { display: grid; gap: 8px; margin-top: 12px; }
.data-actions .btn { justify-content: flex-start; }
.status-line { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-2); }
.status-line svg { flex: none; width: 18px; height: 18px; margin-top: 1px; color: var(--ink-3); }

/* ---------- Diálogos ---------- */
dialog.sheet {
  width: min(560px, 100%);
  max-width: 100%;
  max-height: min(92dvh, 880px);
  padding: 0;
  border: 0;
  border-radius: 18px;
  background: var(--sheet);
  color: var(--ink);
  box-shadow: 0 30px 70px -24px rgba(0, 0, 0, .55);
}
dialog.sheet[open] { display: flex; flex-direction: column; }
dialog.sheet::backdrop { background: var(--backdrop); }
dialog.sheet form { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; margin: 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 14px 4px 18px; }
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 750; font-stretch: 112%; }
.sheet-body { display: grid; gap: 16px; padding: 10px 18px 18px; overflow-y: auto; min-height: 0; flex: 1 1 auto; }
.sheet-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--rule);
  background: var(--sheet);
}
.sheet-foot .spacer { flex: 1; }
.confirm-text { font-size: 14.5px; color: var(--ink-2); }
@media (max-width: 640px) {
  dialog.sheet {
    width: 100%;
    max-width: 100%;
    margin: auto 0 0;
    max-height: 94dvh;
    border-radius: 18px 18px 0 0;
  }
  dialog.sheet.center { margin: auto 12px; width: calc(100% - 24px); border-radius: 16px; }
}

/* Aviso flotante */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--dock-h) + 26px + env(safe-area-inset-bottom, 0px));
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 12px;
  width: max-content;
  max-width: calc(100% - 32px);
  padding: 10px 10px 10px 14px;
  border-radius: 12px;
  background: var(--pen);
  color: var(--pen-ink);
  font-size: 14px;
  box-shadow: 0 14px 34px -14px rgba(0, 0, 0, .55);
  opacity: 0;
  transform: translate(-50%, 8px);
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { flex: none; padding: 5px 10px; border: 1px solid currentColor; border-radius: 8px; background: none; color: inherit; font-weight: 700; font-size: 13px; }

/* ---------- Escritorio ---------- */
@media (min-width: 900px) {
  .app { padding-inline: 28px; padding-bottom: 56px; }
  .masthead { margin-inline: -28px; padding: 18px 28px 14px; border-bottom: 0; }
  .brand-mark { width: 32px; height: 32px; }
  .brand-name { font-size: 20px; }
  .month-switch { margin-left: 28px; }
  .btn.add-desktop { display: inline-flex; margin-left: auto; }
  .dock { position: static; padding: 0; background: none; border-top: 0; }
  .tabs { display: flex; gap: 4px; height: auto; max-width: none; border-bottom: 1px solid var(--rule-2); }
  .tab {
    flex-direction: row;
    gap: 8px;
    padding: 10px 14px 12px;
    font-size: 14px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab:nth-child(3), .tab:nth-child(4) { grid-column: auto; }
  .tab svg { width: 18px; height: 18px; }
  .tab[aria-selected="true"] { border-bottom-color: var(--ink); }
  .tab[aria-selected="true"]::before { display: none; }
  .fab { display: none; }
  .toast { bottom: 28px; }
  .view { padding-top: 20px; gap: 18px; }
  .view.two { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
  .view.two > .wide { grid-column: 1 / -1; }
  .view.two > .col { display: grid; gap: 18px; align-content: start; order: 2; }
  .card { padding: 20px; }
  .cheque { padding: 22px 24px 20px; }
  .hero-split dd { font-size: 17px; }
  #v-movimientos { max-width: 860px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="masthead">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="3.5" width="22" height="25" rx="3"/><path d="M10.5 3.5v25M12.8 3.5v25" stroke-width="1.1"/><path d="M16.5 10h6.5M16.5 15h6.5M16.5 20h4" stroke-linecap="round"/></svg>
      <span class="brand-name">Cuentas Claras</span>
    </div>
    <div class="month-switch" role="group" aria-label="Mes que estás viendo">
      <button class="icon-btn" id="mes-prev" type="button" aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="month-label" id="mes-label" type="button"><span class="m-full" id="mes-full">&nbsp;</span><span class="m-short" id="mes-short">&nbsp;</span></button>
      <button class="icon-btn" id="mes-next" type="button" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <button class="btn btn-primary add-desktop" type="button" data-act="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Agregar movimiento</button>
  </header>

  <div class="dock">
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button class="tab" role="tab" type="button" id="tab-resumen" data-tab="resumen" aria-controls="v-resumen" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 10h7M7 14h4M15 14h2"/></svg><span>Resumen</span></button>
      <button class="tab" role="tab" type="button" id="tab-movimientos" data-tab="movimientos" aria-controls="v-movimientos" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01" stroke-width="2.6"/></svg><span>Movimientos</span></button>
      <button class="tab" role="tab" type="button" id="tab-analisis" data-tab="analisis" aria-controls="v-analisis" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20h17"/><path d="M7 16.5v-5M12 16.5V6M17 16.5V9.5"/></svg><span>Análisis</span></button>
      <button class="tab" role="tab" type="button" id="tab-categorias" data-tab="categorias" aria-controls="v-categorias" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.2 1.2 0 0 1 0 1.7l-6.5 6.5a1.2 1.2 0 0 1-1.7 0z"/><circle cx="8" cy="8" r="1.4"/></svg><span>Categorías</span></button>
    </nav>
    <button class="fab" type="button" data-act="add" aria-label="Agregar movimiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <div id="notice"></div>

  <main>
    <section class="view two" id="v-resumen" role="tabpanel" aria-labelledby="tab-resumen">
      <div class="col">
        <article class="cheque" id="hero" style="--o:1" aria-label="Gasto del mes"></article>
        <article class="card" id="r-meses" style="--o:3"></article>
        <article class="card" id="r-ultimos" style="--o:6"></article>
      </div>
      <div class="col">
        <article class="card" id="r-pred" style="--o:2"></article>
        <article class="card" id="r-top" style="--o:4"></article>
        <article class="card" id="r-ahorro" style="--o:5"></article>
      </div>
    </section>

    <section class="view" id="v-movimientos" role="tabpanel" aria-labelledby="tab-movimientos" hidden>
      <div class="card">
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
            <label class="sr-only" for="f-q">Buscar movimientos</label>
            <input class="input" id="f-q" type="search" placeholder="Buscar por descripción, categoría o método" autocomplete="off">
          </div>
          <div class="chips" id="f-tipo" role="group" aria-label="Tipo de movimiento">
            <button type="button" class="chip on" data-act="ftipo" data-v="" aria-pressed="true">Todos</button>
            <button type="button" class="chip" data-act="ftipo" data-v="g" aria-pressed="false"><i class="dot dot-g"></i>Gastos</button>
            <button type="button" class="chip" data-act="ftipo" data-v="i" aria-pressed="false"><i class="dot dot-i"></i>Ingresos</button>
            <button type="button" class="chip" data-act="ftipo" data-v="a" aria-pressed="false"><i class="dot dot-a"></i>Ahorro</button>
          </div>
          <div class="filters">
            <div class="field"><label for="f-cat">Categoría</label><select class="input" id="f-cat"></select></div>
            <div class="field"><label for="f-met">Método</label><select class="input" id="f-met"></select></div>
          </div>
          <label class="check" for="f-todo"><input type="checkbox" id="f-todo">Buscar en todos los meses</label>
        </div>
      </div>
      <div class="card">
        <p class="list-sum" id="mov-sum"></p>

  function statHTML(lab, val, key) { return '<div class="stat"><div class="lab"><i class="key ' + key + '"></i>' + esc(cap(lab)) + '</div><div class="val">' + val + '</div></div>'; }

  function chartKeys() {

  function drawGuil() {

    if (!w || !h) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = w * dpr; cv.height = h * dpr;
    var ctx = cv.getContext('2d');
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--guil').trim() || '#5d927a';
    ctx.lineWidth = 0.7;
    ctx.globalAlpha = 0.34;
    var cx = w - Math.min(96, w * 0.22), cy = Math.min(h * 0.34, 90), R = Math.min(w * 0.4, 150);
    for (var k = 0; k < 15; k++) {
      ctx.beginPath();
      for (var i = 0; i <= 640; i++) {
        var t = i / 640 * Math.PI * 2;
        var rr = R * (0.62 + 0.07 * Math.sin(12 * t + k * 0.42) + 0.035 * Math.cos(7 * t - k * 0.27)) - k * R * 0.017;
        var x = cx + rr * Math.cos(t), y = cy + rr * Math.sin(t);

    }
  }

    }
    try {
      navigator.clipboard.writeText(csv).then(function () { toast('CSV copiado: ' + A.movs.length + ' movimientos.'); }, fallback);
    } catch (e) { fallback(); }
  }
  function downloadCSV() {
    var csv = '﻿' + toCSV(), name = 'cuentas-claras-' + iso(new Date()) + '.csv';
    if (CAP.downloads) {
      CAP.downloads.save({ filename: name, data: csv }).then(function (r) { if (r && r.status === 'saved') toast('CSV descargado.'); }, function (e) {
        if (e && (e.code === 'declined' || e.code === 'rate_limited')) return;
        toast('No se pudo descargar el archivo. Usa «Copiar todo como CSV».');
      });
      return;
    }
    if (!hostPresent) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }
  }
  function parseCSV(text) {
    text = String(text || '').replace(/^﻿/, '');
    var firstLine = text.split(/\r?\n/)[0] || '';
    var delim = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : ',';
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
      else if (ch === '"') q = true;
      else if (ch === delim) { row.push(f); f = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += ch;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ''; }); });
  }
  function movKey(f, t, cn, m, d) { return f + '|' + t + '|' + norm(cn) + '|' + Number(m).toFixed(2) + '|' + norm(d); }
  function importCSV(text) {
    var rows = parseCSV(text);
    if (rows.length < 2) { toast('El archivo no tiene movimientos.'); return; }
    var head = rows[0].map(norm);
    function idx(names) { for (var i = 0; i < head.length; i++) if (names.indexOf(head[i]) >= 0) return i; return -1; }
    var iF = idx(['fecha', 'date']), iT = idx(['tipo', 'type']), iC = idx(['categoria', 'category']), iP = idx(['metodo', 'metodo de pago', 'method', 'payment method']), iD = idx(['descripcion', 'description', 'detalle', 'concepto']), iM = idx(['monto', 'amount', 'cantidad', 'valor', 'importe']);
    if (iF < 0 || iM < 0 || iC < 0) { toast('El CSV necesita al menos las columnas fecha, categoría y monto.'); return; }
    var seen = {};
    A.movs.forEach(function (m) { var c = catInfo(m.c); seen[movKey(m.f, m.t, c ? c.n : '', m.m, m.d)] = 1; });
    var catsNew = {}, metsNew = {}, movs = [], dup = 0, bad = 0, ord = nextOrd(), mord = nextMetOrd();
    function findCat(n, t) {
      var q = norm(n), c = catList(t).filter(function (x) { return norm(x.n) === q; })[0];
      if (c) return c.id;
      var key = t + '|' + q;
      if (!catsNew[key]) catsNew[key] = { id: uid('c-'), n: cap(String(n).trim()), t: t, k: t === 'g' ? 'n' : '', lim: null, ord: ord++ };
      return catsNew[key].id;
    }
    function findMet(n) {
      var q = norm(n);
      if (!q) return '';
      var m = metList().filter(function (x) { return norm(x.n) === q; })[0];
      if (m) return m.id;
      if (!metsNew[q]) metsNew[q] = { id: uid('p-'), n: cap(String(n).trim()), ord: mord++ };
      return metsNew[q].id;
    }
    rows.slice(1).forEach(function (r, n) {
      var f = parseFecha(r[iF]), m = Math.abs(parseMonto(r[iM])), tt = norm(iT >= 0 ? r[iT] : 'gasto');
      var t = tt.indexOf('ing') === 0 || tt.indexOf('inc') === 0 ? 'i' : tt.indexOf('aho') === 0 || tt.indexOf('sav') === 0 ? 'a' : 'g';
      var cn = String(r[iC] || '').trim(), d = iD >= 0 ? String(r[iD] || '').trim() : '';
      if (!f || !(m > 0) || !cn) { bad++; return; }
      var key = movKey(f, t, cn, m, d);
      if (seen[key]) { dup++; return; }
      seen[key] = 1;
      movs.push({ id: uid('m'), t: t, m: round2(m), f: f, c: findCat(cn, t), p: iP >= 0 ? findMet(r[iP]) : '', d: d, ts: Date.now() + n, e: 0 });
    });
    if (!movs.length) { toast(dup ? 'Todo ya estaba en tu libreta (' + dup + ' repetidos).' : 'No encontré movimientos válidos en el archivo.'); return; }
    opImport(movs, Object.keys(catsNew).map(function (k) { return catsNew[k]; }), Object.keys(metsNew).map(function (k) { return metsNew[k]; }));
    toast('Importé ' + movs.length + ' movimientos' + (dup ? ' (' + dup + ' ya estaban)' : '') + (bad ? '; ' + bad + ' filas con errores' : '') + '.');
  }

  /* ============ Pestañas ============ */
  function setTab(t, anchor) {
    if (VIEWS.indexOf(t) < 0) t = 'resumen';
    ui.tab = t;
    $$('.tab').forEach(function (b) { var on = b.getAttribute('data-tab') === t; b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; });
    VIEWS.forEach(function (v) { $('#v-' + v).hidden = v !== t; });
    try { history.replaceState(null, '', '#' + t); } catch (e) { /* sin historial */ }
    render();
    if (anchor) { var el = document.getElementById(anchor); if (el) el.scrollIntoView({ block: 'start' }); }
    else window.scrollTo(0, 0);
  }

  /* ============ Eventos ============ */
  function bind() {
    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
      switch (act) {
        case 'add': openAdd(); break;
        case 'edit': openEdit(id); break;
        case 'close-mov': closeDlg($('#dlg-mov')); break;
        case 'del-mov': delFromDialog(); break;
        case 'cat-pick': { var c = catInfo(id); if (c) { $('#dm-cat').value = c.n; F.catTouched = true; renderCatChips(); } break; }
        case 'cat-switch': { var c2 = catInfo(id); if (c2) { $('#dm-cat').value = c2.n; F.catTouched = true; setTipo(c2.t); } break; }
        case 'cat-focus': $('#dm-met').focus(); break;
        case 'met-pick': { var mm = metMap()[id]; if (mm) { $('#dm-met').value = mm.n; F.metTouched = true; renderMetChips(); } break; }
        case 'met-focus': $('#dm-desc').focus(); break;
        case 'goto': setTab(el.getAttribute('data-tab'), el.getAttribute('data-anchor')); break;
        case 'mview': ui.mview = el.getAttribute('data-v'); render(); break;
        case 'rview': ui.rview = el.getAttribute('data-v'); render(); break;
        case 'mes': ui.mes = el.getAttribute('data-k'); render(); break;
        case 'ftipo': ui.ftipo = el.getAttribute('data-v'); renderMovs(); break;
        case 'more': ui.movLimit += 300; renderMovs(); break;
        case 'load-ej':
          if (!ready) break;
          opLoadExamples();
          toast('Datos de ejemplo cargados. Bórralos cuando quieras empezar.');
          break;
        case 'clear-ej':
          confirmar({ titulo: 'Borrar datos de ejemplo', texto: 'Se borran solo los ' + A.ej + ' movimientos de ejemplo. Lo que hayas registrado tú se queda.', ok: 'Borrar ejemplos', peligro: true }).then(function (r) {
            if (r) { opClearExamples(); ui.mes = curKey(); toast('Ejemplos borrados. Tu libreta está lista para tus movimientos.'); }
          });
          break;
        case 'clear-all':
          confirmar({ titulo: 'Borrar todos tus datos', texto: 'Se borrarán ' + A.movs.length + ' movimientos y tus categorías volverán a las de fábrica. Esto no se puede deshacer; si quieres, primero copia o descarga el CSV.', ok: 'Borrar todo', peligro: true, focus: '#cf-no' }).then(function (r) {
            if (r) { opClearAll(); ui.mes = curKey(); ui.editCat = null; ui.editMet = null; toast('Listo, tu libreta quedó vacía.'); }
          });
          break;
        case 'copy-csv': copyCSV(); break;
        case 'dl-csv': downloadCSV(); break;
        case 'import-csv': $('#csv-file').click(); break;
        case 'set-lim': {
          var c3 = catInfo(id), v = Number(el.getAttribute('data-v'));
          if (c3 && v > 0 && ready) { opPutCat(Object.assign({}, c3, { lim: v })); toast('Límite de ' + c3.n + ': ' + moneyR(v) + ' al mes.'); }
          break;
        }
        case 'cat-edit':
          ui.editCat = ui.editCat === id ? null : id; ui.editMet = null;
          renderCats(true);
          if (ui.editCat) { var n1 = $('#ce-n'); if (n1) n1.focus(); }
          break;
        case 'cat-close': ui.editCat = null; renderCats(true); break;
        case 'cat-del': delCat(id); break;
        case 'met-edit':
          ui.editMet = ui.editMet === id ? null : id; ui.editCat = null;
          renderCats(true);
          if (ui.editMet) { var n2 = $('#me-n'); if (n2) n2.focus(); }
          break;
        case 'met-close': ui.editMet = null; renderCats(true); break;
        case 'met-del': delMet(id); break;
      }
    });

    $$('.tab').forEach(function (b) {
      b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); });
      b.addEventListener('keydown', function (e) {
        var i = VIEWS.indexOf(b.getAttribute('data-tab')), j = -1;
        if (e.key === 'ArrowRight') j = (i + 1) % VIEWS.length;
        else if (e.key === 'ArrowLeft') j = (i - 1 + VIEWS.length) % VIEWS.length;
        else if (e.key === 'Home') j = 0;
        else if (e.key === 'End') j = VIEWS.length - 1;
        if (j >= 0) { e.preventDefault(); setTab(VIEWS[j]); $('#tab-' + VIEWS[j]).focus(); }
      });
    });
    $('#mes-prev').addEventListener('click', function () { ui.mes = addMonths(ui.mes, -1); render(); });
    $('#mes-next').addEventListener('click', function () { ui.mes = addMonths(ui.mes, 1); render(); });
    $('#mes-label').addEventListener('click', function () { if (ui.mes !== curKey()) { ui.mes = curKey(); render(); } });

    var qTimer = null;
    $('#f-q').addEventListener('input', function (e) { clearTimeout(qTimer); qTimer = setTimeout(function () { ui.q = e.target.value; ui.movLimit = 300; renderMovs(); }, 120); });
    $('#f-cat').addEventListener('change', function (e) { ui.fcat = e.target.value; renderMovs(); });
    $('#f-met').addEventListener('change', function (e) { ui.fmet = e.target.value; renderMovs(); });
    $('#f-todo').addEventListener('change', function (e) { ui.ftodo = e.target.checked; ui.movLimit = 300; renderMovs(); });

    $('#f-mov').addEventListener('submit', onSaveMov);
    $$('input[name="dm-tipo"]').forEach(function (r) {
      r.addEventListener('change', function () {
        var t = r.value, txt = $('#dm-cat').value.trim();
        if (txt) {
          var q = norm(txt);
          var inNew = catList(t).some(function (c) { return norm(c.n) === q; });
          var inOther = catList().some(function (c) { return c.t !== t && norm(c.n) === q; });
          if (!inNew && inOther) $('#dm-cat').value = '';
        }
        setTipo(t);
      });
    });
    $$('input[name="dm-k"]').forEach(function (r) { r.addEventListener('change', function () { $('#dm-kind-hint').textContent = KIND_HINT[r.value]; }); });
    $('#dm-monto').addEventListener('input', function () {
      var v = $('#dm-monto').value, val = parseMonto(v);
      $('#dm-calc').textContent = /\d\s*[+\-]\s*\d/.test(v) && val > 0 ? '= ' + money(val) : '';
      $('#dm-err').textContent = '';
    });
    $('#dm-cat').addEventListener('input', function () { F.catTouched = true; $('#dm-err').textContent = ''; renderCatChips(); });
    $('#dm-met').addEventListener('input', function () { F.metTouched = true; renderMetChips(); });
    $('#dm-desc').addEventListener('input', smartFill);
    $('#dm-desc').addEventListener('change', smartFill);
    $('#dm-monto').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('#dm-cat').focus(); } });
    $('#dm-cat').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('#dm-met').focus(); } });

    $('#cn-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var n = $('#cn-n').value.trim(), t = ($('input[name="cn-t"]:checked') || {}).value || 'g';
      var k = t === 'g' ? (($('input[name="cn-k"]:checked') || {}).value || 'n') : '';
      var err = $('#cn-err');
      if (!n) { err.textContent = 'Escribe el nombre de la categoría.'; $('#cn-n').focus(); return; }
      if (catList(t).some(function (c) { return norm(c.n) === norm(n); })) { err.textContent = 'Ya tienes «' + n + '» en ' + TIPO_PL[t].toLowerCase() + '.'; return; }
      if (!ready) { err.textContent = 'Conectando con tu libreta… intenta en un momento.'; return; }
      err.textContent = '';
      var c = { id: uid('c-'), n: cap(n), t: t, k: k, lim: null, ord: nextOrd() };
      opPutCat(c);
      $('#cn-n').value = '';
      toast('Categoría creada: ' + c.n + '.');
    });
    $$('input[name="cn-t"]').forEach(function (r) { r.addEventListener('change', function () { $('#cn-k').hidden = !$('#cn-t-g').checked; }); });
    $('#mn-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var n = $('#mn-n').value.trim(), err = $('#mn-err');
      if (!n) { err.textContent = 'Escribe el nombre del método.'; $('#mn-n').focus(); return; }
      if (metList().some(function (m) { return norm(m.n) === norm(n); })) { err.textContent = 'Ya tienes «' + n + '».'; return; }
      if (!ready) { err.textContent = 'Conectando con tu libreta… intenta en un momento.'; return; }
      err.textContent = '';
      opPutMet({ id: uid('p-'), n: cap(n), ord: nextMetOrd() });
      $('#mn-n').value = '';
      toast('Método agregado: ' + cap(n) + '.');
    });
    $('#cat-list').addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target, id = f.getAttribute('data-id'), c = catInfo(id), err = $('#ce-err');
      if (!c) return;
      var n = $('#ce-n').value.trim();
      if (!n) { err.textContent = 'El nombre no puede quedar vacío.'; return; }
      if (catList(c.t).some(function (x) { return x.id !== id && norm(x.n) === norm(n); })) { err.textContent = 'Ya existe otra categoría con ese nombre.'; return; }
      var k = c.k, lim = c.lim;
      if (c.t === 'g') {
        k = (f.querySelector('input[name="ce-k"]:checked') || {}).value || 'n';
        var lt = $('#ce-l').value.trim();
        if (lt) { var v = parseMonto(lt); if (!(v > 0)) { err.textContent = 'Escribe un límite mayor que cero o déjalo vacío.'; return; } lim = v; } else lim = null;
      }
      if (!ready) { err.textContent = 'Conectando con tu libreta… intenta en un momento.'; return; }
      opPutCat({ id: id, n: cap(n), t: c.t, k: k, lim: lim, ord: c.ord });
      ui.editCat = null;
      renderCats(true);
      toast('Categoría actualizada.');
    });
    $('#cat-list').addEventListener('change', function (e) {
      if (e.target.name === 'ce-k') { var hn = $('#ce-hint'); if (hn) hn.textContent = KIND_HINT[e.target.value]; }
    });
    $('#met-list').addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target, id = f.getAttribute('data-id'), m = metMap()[id], err = $('#me-err');
      if (!m) return;
      var n = $('#me-n').value.trim();
      if (!n) { err.textContent = 'El nombre no puede quedar vacío.'; return; }
      if (metList().some(function (x) { return x.id !== id && norm(x.n) === norm(n); })) { err.textContent = 'Ya existe otro método con ese nombre.'; return; }
      if (!ready) { err.textContent = 'Conectando con tu libreta… intenta en un momento.'; return; }
      opPutMet({ id: id, n: cap(n), ord: m.ord || 0 });
      ui.editMet = null;
      renderCats(true);
      toast('Método actualizado.');
    });
    $('#a-ahorro').addEventListener('input', function (e) {
      if (e.target.id !== 'recorte') return;
      ui.recorte = Number(e.target.value);
      var S = ahorroData();
      $('#recorte-out').textContent = ui.recorte + '%';
      $('#save-total').innerHTML = saveTotalText(S);
      $('#sv-list').innerHTML = S.list.map(function (x) { return svRowHTML(x, true); }).join('');
    });
    $('#a-ahorro').addEventListener('change', function (e) {
      if (e.target.id !== 'recorte' || !ready) return;
      var v = Number(e.target.value);
      if ((cfg().prefs || {}).recorte !== v) opPrefs({ recorte: v });
    });
    $('#csv-file').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      var rd = new FileReader();
      rd.onload = function () { importCSV(String(rd.result || '')); };
      rd.onerror = function () { toast('No se pudo leer el archivo.'); };
      rd.readAsText(file);
    });
    document.addEventListener('pointerdown', function (e) {
      $$('.chart-wrap').forEach(function (w) {
        if (w.contains(e.target)) return;
        var t = $('.tip', w); if (t) t.hidden = true;
        var l = $('#rx-line', w); if (l) l.setAttribute('visibility', 'hidden');
        ['#rx-dot', '#rx-pdot'].forEach(function (s) { var dd = $(s, w); if (dd) dd.setAttribute('visibility', 'hidden'); });
      });
    });
    var lastW = window.innerWidth, rt = null;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () {
        if (Math.abs(window.innerWidth - lastW) < 2) return;
        lastW = window.innerWidth;
        if (ui.tab === 'resumen') { drawGuil(); var cm = $('#ch-meses'); if (cm) drawMeses(cm); }
        else if (ui.tab === 'analisis') { var cr = $('#ch-ritmo'); if (cr) drawRitmo(cr); }
      }, 140);
    });
    try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawGuil); } catch (e) { /* viejo */ }
    try { new MutationObserver(drawGuil).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] }); } catch (e) { /* viejo */ }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (ui.tab === 'resumen') drawGuil(); });
  }

  function delCat(id) {
    var c = catInfo(id);
    if (!c) return;
    var uses = A.catUse[id] || 0, others = catList(c.t).filter(function (x) { return x.id !== id; });
    if (uses > 0 && !others.length) { toast('Es tu única categoría de ' + TIPO_PL[c.t].toLowerCase() + ' y tiene movimientos; crea otra antes de borrarla.'); return; }
    var extra = uses > 0 ? '<div class="field"><label for="cf-move">Pasar sus ' + uses + (uses === 1 ? ' movimiento' : ' movimientos') + ' a</label><select class="input" id="cf-move">' + others.map(function (o) { return '<option value="' + esc(o.id) + '">' + esc(o.n) + '</option>'; }).join('') + '</select></div>' : '';
    confirmar({
      titulo: 'Eliminar «' + c.n + '»',
      texto: uses > 0 ? 'Esta categoría tiene ' + uses + (uses === 1 ? ' movimiento' : ' movimientos') + '. Elige a cuál pasarlos antes de eliminarla.' : 'No tiene movimientos, así que no se pierde nada.',
      ok: 'Eliminar', peligro: true, extra: extra,
      read: function () { var s = $('#cf-move'); return s ? s.value : null; }
    }).then(function (r) {
      if (!r || !ready) return;
      opDelCat(id, r.value);
      ui.editCat = null;
      toast('Categoría eliminada.');
    });
  }
  function delMet(id) {
    var m = metMap()[id];
    if (!m) return;
    var uses = A.metUse[id] || 0, others = metList().filter(function (x) { return x.id !== id; });
    var extra = uses > 0 ? '<div class="field"><label for="cf-move">Pasar sus ' + uses + (uses === 1 ? ' movimiento' : ' movimientos') + ' a</label><select class="input" id="cf-move">' + others.map(function (o) { return '<option value="' + esc(o.id) + '">' + esc(o.n) + '</option>'; }).join('') + '<option value="">Sin método</option></select></div>' : '';
    confirmar({
      titulo: 'Eliminar «' + m.n + '»',
      texto: uses > 0 ? 'Este método se usa en ' + uses + (uses === 1 ? ' movimiento' : ' movimientos') + '. Elige con cuál reemplazarlo.' : 'No se usa en ningún movimiento.',
      ok: 'Eliminar', peligro: true, extra: extra,
      read: function () { var s = $('#cf-move'); return s ? s.value : ''; }
    }).then(function (r) {
      if (!r || !ready) return;
      opDelMet(id, r.value || '');
      ui.editMet = null;
      toast('Método eliminado.');
    });
  }

  /* ============ Inicio ============ */
  var h0 = (location.hash || '').replace('#', '');
  if (VIEWS.indexOf(h0) >= 0) ui.tab = h0;
  bind();
  setTab(ui.tab);
  connect();
})();
</script>
